name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Content-agent pull requests (branches content/...) may only change bundle files (ADR 0005).
  content-scope:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'content/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only content/imports/*.json may change
        env:
          BASE: ${{ github.base_ref }}
        run: |
          bad=$(git diff --name-only "origin/$BASE...HEAD" | grep -vE '^content/imports/[a-z0-9-]+\.json$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Content pull requests may only change content/imports/*.json. Other files:"
            echo "$bad"
            exit 1
          fi

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # Disposable Postgres for migration + policy tests (Supabase shim, ADR 0004).
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:db
      - run: pnpm build
      - name: Service-role key must never reach client bundles
        run: |
          test -d apps/web/.next/static || { echo "client bundle directory missing" >&2; exit 1; }
          if grep -rlE 'SUPABASE_SERVICE_ROLE_KEY|"role"[[:space:]]*:[[:space:]]*"service_role"' apps/web/.next/static; then
            echo "Service-role key reference found in client bundle" >&2
            exit 1
          fi

  # ADR 0004 mitigation / backlog M1-13: the same DB suite on a REAL local Supabase stack
  # (no shim), plus an auth + data-API smoke test. Keys are the stack's throwaway local keys.
  supabase-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Start local Supabase (auth, data API, database only)
        run: supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Export local stack URL and keys
        run: supabase status -o env | sed -E 's/^([A-Z_]+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"
      - name: DB policy tests on the real stack
        run: pnpm test:db
        env:
          DB_TEST_TARGET: supabase
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Auth + API smoke test
        run: pnpm --filter @examsaathi/supabase test:stack
      - name: Build web app against the local stack
        run: pnpm --filter @examsaathi/web build
        env:
          SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          APP_BASE_URL: http://127.0.0.1:3000
      - name: Install Playwright browser
        run: pnpm --filter @examsaathi/web exec playwright install --with-deps chromium
      - name: End-to-end tests (real browser, real auth, real email via Mailpit)
        run: pnpm --filter @examsaathi/web exec playwright test
        env:
          SUPABASE_URL: ${{ env.API_URL }}
          SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          APP_BASE_URL: http://127.0.0.1:3000
      - name: Show failed-page snapshots in the log
        if: failure()
        run: |
          for f in $(find apps/web/test-results -name 'error-context.md' 2>/dev/null); do
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
