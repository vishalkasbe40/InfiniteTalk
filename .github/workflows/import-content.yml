name: Import content drafts

# Loads official-exam bundles from content/imports as DRAFTS (ADR 0005). Nothing is approved here:
# a reviewer approves each item in Admin -> Exams and syllabus. Safe to re-run.
on:
  push:
    branches: [main]
    paths: ['content/imports/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-content
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    environment: supabase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Import bundles as drafts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node content/import.mjs
